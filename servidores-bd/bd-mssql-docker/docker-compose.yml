version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: my-sqlserver
    restart: always
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=AlumnoSql2025!
    volumes:
      - sqlserver_data:/var/opt/mssql
    cap_add:
      - SYS_PTRACE

volumes:
  sqlserver_data:
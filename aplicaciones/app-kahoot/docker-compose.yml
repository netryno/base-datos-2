# La app se une a las redes donde ya corren MongoDB (mongo-d) y Redis (redis-d),
# levantados con los proyectos bd-mongo y bd-redis-docker. Hosts y redes en el .env.
services:
  web:
    build: .
    container_name: app-kahoot
    ports:
      - "${APP_PORT:-8078}:${APP_PORT:-8078}"
    env_file:
      - .env
    networks:
      - mongo
      - redis
    restart: unless-stopped

networks:
  mongo:
    external: true
    name: ${DOCKER_MONGO_NETWORK:-bd-mongo_default}
  redis:
    external: true
    name: ${DOCKER_REDIS_NETWORK:-bd-redis-docker_default}

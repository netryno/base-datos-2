version: '3.8'

services:
  api:
    build: .
    container_name: personas-seed
    ports:
      - "8077:8000"
    environment:
      # Ruta del archivo SQLite dentro del contenedor (persiste vía bind mount)
      - DATABASE_PATH=/app/data/personas.db
    volumes:
      # Monta el código para desarrollo (hot-reload)
      - .:/app
      # Bind mount: la carpeta ./data del proyecto se ve directamente en el contenedor.
      # El archivo personas.db aparece en tu proyecto y lo abrís con VSCode + SQLite Viewer.
      - ./data:/app/data
      - /app/__pycache__          # Opcional: excluir caché
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

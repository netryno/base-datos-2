services:
  web:
    build: .
    container_name: buscador-idiomas-chroma
    ports:
      - "${APP_PORT:-8120}:${APP_PORT:-8120}"
    env_file:
      - .env
    environment:
      # Dentro del contenedor, localhost es el propio contenedor.
      # Chroma sigue publicado en el host, puerto 8000.
      CHROMA_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:

version: '3.8'

services:
  api:
    build: .
    container_name: tutorial-api-mongodb
    ports:
      - "${API_HOST_PORT}:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - mongo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

# Red del docker-compose bd-mongo (contenedor mongo).
networks:
  mongo:
    external: true
    name: ${DOCKER_MONGO_NETWORK}
